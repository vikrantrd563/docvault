name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  deploy-api:
    name: Deploy .NET API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Publish API
        run: dotnet publish ./api/DocVault.Api/DocVault.Api.csproj -c Release -o ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "docvault-api"
          package: "./publish"
