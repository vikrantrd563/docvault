name: CI - Build and Test

on:
  pull_request:
    branches: [dev, main]

jobs:
  build-api:
    name: Build .NET API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: dotnet restore ./api/DocVault.Api/DocVault.Api.csproj

      - name: Build API
        run: dotnet build ./api/DocVault.Api/DocVault.Api.csproj --no-restore

  build-frontend:
    name: Build Angular App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm packages
        run: npm ci --prefix ./frontend/docvault-frontend

      - name: Build Angular for production
        run: npm run build --prefix ./frontend/docvault-frontend -- --configuration production
