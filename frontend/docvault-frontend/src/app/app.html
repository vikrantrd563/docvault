<mat-toolbar color="primary">
  <span>🔒 DocVault</span>
  <span style="flex:1"></span>
  <a mat-button routerLink="/dashboard"
     *ngIf="loggedIn"
     style="color:white;margin-right:8px">Dashboard</a>
  <span *ngIf="loggedIn" style="margin-right:16px">
    {{ userName }}
  </span>
  <button *ngIf="loggedIn" mat-icon-button (click)="logout()">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>
<router-outlet></router-outlet>
